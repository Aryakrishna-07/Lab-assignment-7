<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colourful Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#ff6a88,#ff99ac,#a18cd1,#4facfe);background-size:300% 300%;animation:bg 12s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.card{background:rgba(255,255,255,.92);border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h1{margin:0 0 4px;text-align:center;background:linear-gradient(90deg,#ff512f,#dd2476,#7f00ff,#00c6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#666;margin:0 0 18px;font-size:.9rem}
label{display:block;margin:12px 0 5px;font-weight:600;color:#444;font-size:.85rem}
input{width:100%;padding:12px;font-size:1.1rem;border:2px solid #e3e3f0;border-radius:10px;transition:.2s}
input:focus{outline:none;border-color:#7f00ff;box-shadow:0 0 0 3px rgba(127,0,255,.2)}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.ops input{display:none}
.ops label{margin:0;padding:12px 0;text-align:center;font-size:1.5rem;color:#fff;border-radius:10px;cursor:pointer;opacity:.55;transition:.2s}
.ops input:checked+label{opacity:1;transform:scale(1.1);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.add{background:#22c55e}.sub-op{background:#f59e0b}.mul{background:#3b82f6}.div{background:#ec4899}
.row{display:flex;gap:10px;margin-top:20px}
button{flex:1;padding:13px;font-size:1rem;font-weight:700;border:none;border-radius:10px;color:#fff;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.calc{background:linear-gradient(90deg,#7f00ff,#e100ff)}
.clear{background:linear-gradient(90deg,#ff5f6d,#ffc371)}
#result{margin-top:20px;padding:16px;border-radius:12px;text-align:center;font-size:1.4rem;font-weight:700;color:#fff;background:#94a3b8;word-break:break-all;transition:.3s}
#result.add{background:#22c55e}#result.sub-op{background:#f59e0b}#result.mul{background:#3b82f6}#result.div{background:#ec4899}#result.error{background:#ef4444;font-size:1rem}
</style>
</head>
<body>
<div class="card">
  <h1>🧮 Calculator</h1>
  <p class="sub">Pick an operation, enter two numbers, and calculate!</p>

  <form id="calcForm" novalidate>
    <label for="num1">First number</label>
    <input type="number" id="num1" step="any" placeholder="e.g. 12">

    <label>Operation</label>
    <div class="ops">
      <input type="radio" name="op" id="o1" value="add" checked><label for="o1" class="add">+</label>
      <input type="radio" name="op" id="o2" value="sub"><label for="o2" class="sub-op">−</label>
      <input type="radio" name="op" id="o3" value="mul"><label for="o3" class="mul">×</label>
      <input type="radio" name="op" id="o4" value="div"><label for="o4" class="div">÷</label>
    </div>

    <label for="num2">Second number</label>
    <input type="number" id="num2" step="any" placeholder="e.g. 4">

    <div class="row">
      <button type="submit" class="calc">Calculate</button>
      <button type="reset" class="clear">Clear</button>
    </div>
  </form>

  <div id="result">Result appears here</div>
</div>

<script>
const form = document.getElementById("calcForm");
const out = document.getElementById("result");
const symbols = { add: "+", sub: "−", mul: "×", div: "÷" };
const classes = { add: "add", sub: "sub-op", mul: "mul", div: "div" };

function show(msg, cls) {
  out.textContent = msg;
  out.className = cls || "";
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  const a = document.getElementById("num1").value.trim();
  const b = document.getElementById("num2").value.trim();
  const op = form.elements["op"].value;

  if (a === "" || b === "") return show("Please enter both numbers.", "error");
  const x = parseFloat(a), y = parseFloat(b);
  if (isNaN(x) || isNaN(y)) return show("Inputs must be valid numbers.", "error");

  let r;
  if (op === "add") r = x + y;
  else if (op === "sub") r = x - y;
  else if (op === "mul") r = x * y;
  else {
    if (y === 0) return show("Cannot divide by zero.", "error");
    r = x / y;
  }
  r = parseFloat(r.toPrecision(12));
  show(x + " " + symbols[op] + " " + y + " = " + r, classes[op]);
});

form.addEventListener("reset", function () {
  show("Result appears here", "");
});
</script>
</body>
</html>
